ing:30px 52px 34px;counter-reset:panels;animation:panelReveal .5s cubic-bezier(.2,.8,.2,1) both}.panel-list li{break-inside:avoid;margin:0 0 14px;padding-left:8px;color:#253550;line-height:1.5;font-weight:650;animation:panelItem .42s ease both;animation-delay:var(--panel-delay)}.panel-list li::marker{color:#27539f;font-weight:900}.panel-item{border-bottom:1px solid rgba(39,83,159,.16);padding-bottom:12px}.panel-item>summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:2px 0;color:#253550;transition:color .25s}.panel-item>summary:hover{color:#27539f}.panel-item>summary b{flex:0 0 auto;background:#eef3fc;color:#27539f}.panel-item>summary b:before{transform:translateX(-2px) rotate(-45deg)}.panel-item[open]>summary b{transform:rotate(90deg);background:#27539f;color:#fff}.panel-item p{padding:13px 42px 3px 0;font-size:14px;line-height:1.65;animation:panelReveal .35s ease both}@keyframes panelReveal{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}@keyframes panelItem{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.activity-category,.panel-list summary,.panel-list summary i,.panel-list summary i b,.panel-list ol,.panel-list li,.panel-item p{animation:none!important;transition:none!important}}
